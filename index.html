<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زاهدان گلد | Zahedan Gold</title>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-gold-hover: #d97706;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .avatar-container {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #b45309);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin: 28px 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .link-card:hover {
            border-color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.05);
            transform: translateY(-2px);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-info i {
            font-size: 1.25rem;
            color: var(--accent-gold);
        }

        .offices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        @media (max-width: 520px) {
            .offices-grid {
                grid-template-columns: 1fr;
            }
        }

        .office-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            text-align: right;
        }

        .office-card h3 {
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .office-card p {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
        }

        footer {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوگو / آیکون -->
        <div class="avatar-container">
            <i class="fa-solid fa-coins"></i>
        </div>

        <!-- عنوان اصلی -->
        <h1>زاهدان گلد</h1>
        <p class="subtitle">اطلاع‌رسانی قیمت و نرخ لحظه‌ای آبشده</p>

        <!-- کانال‌های تلگرام -->
        <div class="section-title">
            <i class="fa-brands fa-telegram"></i>
            <span>کانال‌های ارتباطی</span>
        </div>

        <a href="https://t.me/zahedangold" target="_blank" class="link-card">
            <div class="link-info">
                <i class="fa-brands fa-telegram"></i>
                <span>کانال تلگرام زاهدان گلد</span>
            </div>
            <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; color: var(--text-secondary);"></i>
        </a>

        <!-- دفاتر رسمی -->
        <div class="section-title">
            <i class="fa-solid fa-building"></i>
            <span>دفاتر ما</span>
        </div>

        <div class="offices-grid">
            <div class="office-card">
                <h3><i class="fa-solid fa-location-dot"></i> دفتر زاهدان</h3>
                <p>جهت استعلام نرخ و هماهنگی‌های حضوری در شهر زاهدان</p>
            </div>
            <div class="office-card">
                <h3><i class="fa-solid fa-location-dot"></i> دفتر مشهد</h3>
                <p>جهت استعلام نرخ و هماهنگی‌های حضوری در شهر مشهد</p>
            </div>
        </div>

        <!-- فوتر -->
        <footer>
            &copy; تمامی حقوق برای مجموعه زاهدان گلد محفوظ است.
        </footer>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زاهدان گلد | Zahedan Gold</title>
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-inner-bg: #0d0e11;
            --border-gold: #d4af37;
            --border-gold-subtle: rgba(212, 175, 55, 0.25);
            --text-gold: #e5c158;
            --gold-gradient: linear-gradient(135deg, #fff2c2 0%, #d4af37 50%, #aa7c11 100%);
            --text-primary: #ffffff;
            --text-secondary: #a3a8b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            text-align: center;
        }

        /* لوگو با فریم طلایی */
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: var(--gold-gradient);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-gold);
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* دکمه‌های ارتباطی */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* پس‌زمینه آبی خام/مات برای تلگرام */
        .social-link.telegram {
            background: rgba(22, 45, 68, 0.75);
            border: 1px solid rgba(46, 110, 168, 0.5);
            box-shadow: 0 4px 15px rgba(18, 38, 58, 0.4);
        }
        .social-link.telegram:hover {
            background: rgba(28, 58, 88, 0.9);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        /* پس‌زمینه سبز خام/مات برای واتس‌اپ */
        .social-link.whatsapp {
            background: rgba(18, 48, 32, 0.75);
            border: 1px solid rgba(35, 100, 62, 0.5);
            box-shadow: 0 4px 15px rgba(15, 40, 26, 0.4);
        }
        .social-link.whatsapp:hover {
            background: rgba(24, 65, 43, 0.9);
            border-color: #22c55e;
            transform: translateY(-2px);
        }

        /* پس‌زمینه بنفش خام/مات برای روبیکا */
        .social-link.rubika {
            background: rgba(45, 20, 58, 0.75);
            border: 1px solid rgba(95, 40, 120, 0.5);
            box-shadow: 0 4px 15px rgba(35, 15, 45, 0.4);
        }
        .social-link.rubika:hover {
            background: rgba(60, 26, 78, 0.9);
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .social-link .inner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .social-link i.brand-icon {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
            color: var(--text-gold);
        }

        .arrow-icon {
            font-size: 0.8rem;
            color: var(--text-gold);
        }

        /* کارت‌های آدرس و تماس */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-inner-bg);
            border: 1px solid var(--border-gold-subtle);
            border-radius: 18px;
            padding: 18px 16px;
            text-align: right;
            transition: all 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-gold);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gold);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.65;
            margin-bottom: 12px;
        }

        /* دکمه‌های شماره تماس */
        .phones-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            direction: ltr;
            justify-content: flex-end;
        }

        .phone-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--border-gold-subtle);
            color: var(--text-gold);
            padding: 6px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .phone-btn:hover {
            background: var(--border-gold);
            color: #000000;
            font-weight: 700;
        }

        footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid var(--border-gold-subtle);
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوگوی اصلی -->
        <div class="logo-container">

        <!-- عناوین -->
        <h1>زاهدان گلد</h1>
        <p class="subtitle">آبشده و سکه | اطلاع‌رسانی نرخ لحظه‌ای طلا</p>

        <!-- کانال‌ها -->
        <div class="links-container">
            <a href="https://t.me/zahedangold" target="_blank" class="social-link telegram">

                <div class="inner">
                    <i class="fa-brands fa-whatsapp brand-icon"></i>

                <i class="fa-solid fa-chevron-left arrow-icon"></i>

            <a href="https://rubika.ir/zahedangold" target="_blank" class="social-link rubika">
                <div class="inner">
                    <i class="fa-solid fa-paper-plane brand-icon"></i>

            </a>
        </div>

        <!-- دفاتر ما -->
        <div class="grid-2">
            <!-- دفتر مشهد -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>دفتر مشهد</span>
                </div>
                <p>مجتمع طلا و جواهر مرمر، طبقه منفی ۱، پلاک ۲۸</p>
                <div class="phones-container">
                    <a href="tel:05138554300" class="phone-btn"><i class="fa-solid fa-phone"></i> 051-38554300</a>
                    <a href="tel:05138548400" class="phone-btn"><i class="fa-solid fa-phone"></i> 051-38548400</a>
                </div>
            </div>

            <!-- دفتر زاهدان -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>دفتر زاهدان</span>
                </div>
                <p>بازار طلا و جواهر حافظ، انتهای پاساژ مروارید</p>
                <div class="phones-container">
                    <a href="tel:05434112203" class="phone-btn"><i class="fa-solid fa-phone"></i> 054-34112203</a>
                </div>
            </div>
        </div>

        <!-- فوتر -->
        <footer>
            &copy; تمامی حقوق برای مجموعه زاهدان گلد محفوظ است.
        </footer>
    </div>

</body>
</html>

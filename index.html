
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="راه‌های ارتباطی و شبکه‌های اجتماعی زاهدان گلد">
  <title>زاهدان گلد | Zahedan Gold</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: radial-gradient(ellipse at top, #332713 0%, #171510 35%, #0c0c0c 75%);
      color: #f8f2e5;
      display: flex;
      justify-content: center;
      padding: 38px 18px;
    }

    main {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border: 2px solid #d9b66a;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #e7c779;
      font-size: 31px;
      font-weight: bold;
      letter-spacing: -2px;
      box-shadow: 0 0 30px #c69c3922;
    }

    h1 {
      color: #e7c779;
      font-size: 27px;
      margin: 0 0 8px;
    }

    .english {
      color: #c6b78f;
      font-size: 13px;
      letter-spacing: 3px;
      direction: ltr;
    }

    .intro {
      color: #c3c0b8;
      font-size: 14px;
      line-height: 2;
      margin: 20px 0 25px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      min-height: 56px;
      padding: 15px;
      border: 1px solid #8f753d;
      border-radius: 12px;
      color: #f4e4bd;
      background: linear-gradient(110deg, #282319, #191714);
      text-decoration: none;
      font-size: 15px;
      transition: .2s;
    }

    .link:hover {
      border-color: #f0d28a;
      background: #352b19;
      transform: translateY(-2px);
    }

    .symbol {
      color: #e7c779;
      font-size: 18px;
    }

    .section-title {
      color: #d6bb7b;
      font-size: 13px;
      margin: 28px 0 13px;
    }

    footer {
      color: #777268;
      font-size: 11px;
      margin-top: 32px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">ZG</div>

    <h1>زاهدان گلد</h1>
    <div class="english">ZAHEDAN GOLD</div>

    <p class="intro">
      به صفحه رسمی ارتباط با زاهدان گلد خوش آمدید.
      <br>
      تمام راه‌های ارتباطی در یک مکان.
    </p>

    <div class="links">
      <a class="link" href="tel:YOUR_PHONE">
        <span class="symbol">☎</span>
        تماس تلفنی
      </a>

      <a class="link" href="https://wa.me/YOUR_WHATSAPP">
        <span class="symbol">◉</span>
        ارتباط در واتساپ
      </a>

      <a class="link" href="https://t.me/YOUR_TELEGRAM">
        <span class="symbol">➤</span>
        کانال و ارتباط تلگرام
      </a>

      <a class="link" href="https://instagram.com/YOUR_INSTAGRAM">
        <span class="symbol">◎</span>
        صفحه اینستاگرام
      </a>

      <div class="section-title">آدرس و موقعیت مکانی</div>

      <a class="link" href="YOUR_MAP_LINK">
        <span class="symbol">⌖</span>
        مشاهده موقعیت روی نقشه
      </a>
    </div>

    <footer>
      Zahedan Gold<br>
      © تمام حقوق محفوظ است.
    </footer>
  </main>
</body>
</html>
